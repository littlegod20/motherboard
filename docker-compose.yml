services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: boardscan
      POSTGRES_PASSWORD: boardscan
      POSTGRES_DB: boardscan
    ports:
      - '5435:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U boardscan -d boardscan']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6381:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://boardscan:boardscan@postgres:5432/boardscan?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: local-dev-access-secret-min-32-chars!!
      JWT_REFRESH_SECRET: local-dev-refresh-secret-min-32-chars!
      CORS_ORIGINS: http://localhost:8081,http://localhost:19006
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRO_PRICE_ID: ${STRIPE_PRO_PRICE_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
